services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tgseo
      POSTGRES_USER: tgseo_user
      POSTGRES_PASSWORD: tgseo_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgseo_user -d tgseo"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file: .env.worker
    volumes:
      - /opt/tg-seo-platform/google-indexing-key.json:/app/google-indexing-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/bigselle2014-netizen/tg-seo-platform/frontend:latest
    env_file: .env.frontend
    ports:
      - "0.0.0.0:8200:3000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/mini || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
